name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"ua.zaporizhzhia.alerts","appName":"Zaporizhzhia Alerts","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Add native alert service
        run: |
          D=android/app/src/main/java/ua/zaporizhzhia/alerts
          mkdir -p $D
          cat > $D/Parser.java <<'ZPEOF'
          package ua.zaporizhzhia.alerts;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class Parser {
              public static class Msg { public String id; public String text; public long ms; }
              public static class Res { public String type; public String comm; public String action; public String street = ""; }

              private static final Pattern POST = Pattern.compile("<div class=\"tgme_widget_message(?: [^\"]*)?\"[^>]*?data-post=\"([^\"]+)\"");
              private static final Pattern TEXT = Pattern.compile("<div class=\"tgme_widget_message_text js-message_text\"[^>]*>(.*?)</div>", Pattern.DOTALL);
              private static final Pattern TIME = Pattern.compile("<time[^>]*datetime=\"([^\"]+)\"");

              private static final String NB = "(?<![\\p{L}])";
              private static final int FL = Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE;
              private static Pattern r(String w) { return Pattern.compile(NB + "(?:" + w + ")", FL); }

              private static final String[] TYPE_NAMES = {"Загроза FPV", "Загроза шахедів", "Ракета", "КАБ", "Артобстріл", "Вибух", "Загроза дронів"};
              private static final Pattern[] TYPE_RE = {
                  r("fpv|фпв|камікадзе"),
                  r("шахед|shahed|герань|геран|бпла|безпілотник"),
                  r("ракет|іскандер|калібр"),
                  Pattern.compile(NB + "(?:каб|авіабомб)(?![\\p{L}])", FL),
                  r("обстріл|артобстріл|приліт|артилері|міномет|смерч"),
                  r("вибух|детонац|прильот"),
                  r("дрон")
              };
              private static final String[] COMM_NAMES = {"Балабине","Новоолександрівка","Малокатеринівка","Комишуваха","Кушугум","Нижня Хортиця","Оріхів","Гуляйполе","Степногірськ","Мала Токмачка","Преображенка","Вільнянськ","Широке","Біленьке","Долинське","Матвіївка","Новомиколаївка","Воздвижівка","Петро-Михайлівка","Михайлівка","Павлівка","Степне","Тернувате","Запоріжжя"};
              private static final Pattern[] COMM_RE = {
                  r("балабин"), r("новоолександрів"), r("малокатерин"), r("комишува"), r("кушуг"), r("хортиц"), r("оріхів|оріхов"), r("гуляйпол"), r("степногірськ"), r("токмачк"), r("преображенк"), r("вільнянськ"), r("широківськ|широке(?![\\p{L}])"), r("біленьк"), r("долинськ"), r("матвіївк|матвіївськ"), r("новомиколаїв"), r("воздвиж"), r("петро-?михайлів"), r("михайлівк"), r("павлівк|павлівськ"), r("степненськ|степне(?![\\p{L}])"), r("тернуват"), r("запоріж|запорізьк")
              };
              private static final Pattern RKILL = r("збит|знищен|збили");
              private static final Pattern RDET = r("детонац|вибух");
              private static final Pattern RFALL = r("падін|влуч|приліт|впав|впал");
              private static final Pattern RAKV = r("акватор");
              private static final Pattern RALL = r("відбій|відбою");

              private static final Pattern RNEG = r("стають|посилюємо|допомагаємо|експерт|аналітик|підсумк|статистик|за ніч|за добу|за минул|протягом доби|станом на|донат|підтримай");
              private static final Pattern REVT = r("виявлен|летить|летять|літає|літають|напрямк|курсом|група|груп|прилітал|приліт|вибух|детонац|влуч|падін|впав|впал|збит|знищен|обстріл|атак|заходить|заходять|рухається|рухаються|прямує|прямують|над ");
              private static final String SKW = "(вулиц[яіюе]|вул\\.?|проспект\\p{L}*|просп\\.?|пр-т\\.?|бульвар\\p{L}*|бул\\.?|б-р\\.?|провулок|провулк\\p{L}*|пров\\.?|площ[аіу]|пл\\.|шосе|набережн\\p{L}*|мікрорайон\\p{L}*|мкр\\.?)";
              private static final String CAPW = "[\\p{L}'’ʼ-]+";
              private static final Pattern STREET_A = Pattern.compile("(?<![\\p{L}])(?iu:" + SKW + ")\\s+(" + CAPW + "(?:\\s+" + CAPW + ")?)");
              private static final Pattern STREET_B = Pattern.compile("(" + CAPW + ")\\s+(?iu:" + SKW + ")(?![\\p{L}])");

              static boolean okText(String t) {
                  if (t.length() > 400 || RNEG.matcher(t).find()) return false;
                  if (t.length() > 140 && !REVT.matcher(t).find()) return false;
                  return true;
              }

              static String normKw(String k) {
                  k = k.toLowerCase(Locale.ROOT).replace(".", "");
                  if (k.startsWith("вул")) return "вулиця";
                  if (k.startsWith("просп") || k.startsWith("пр-т")) return "проспект";
                  if (k.startsWith("бульв") || k.startsWith("бул") || k.startsWith("б-р")) return "бульвар";
                  if (k.startsWith("пров")) return "провулок";
                  if (k.startsWith("площ") || k.startsWith("пл")) return "площа";
                  if (k.startsWith("шосе")) return "шосе";
                  if (k.startsWith("набереж")) return "набережна";
                  if (k.startsWith("мікрор") || k.startsWith("мкр")) return "мікрорайон";
                  return k;
              }

              static boolean isCap(String w) {
                  return w.length() > 0 && Character.isUpperCase(w.codePointAt(0)) && Character.isLetter(w.codePointAt(0));
              }

              static String streets(String text) {
                  List<String> out = new ArrayList<String>();
                  Matcher a = STREET_A.matcher(text);
                  while (a.find()) {
                      String[] ws = a.group(2).split("\\s+");
                      StringBuilder keep = new StringBuilder();
                      for (String w : ws) {
                          if (!isCap(w)) break;
                          if (keep.length() > 0) keep.append(' ');
                          keep.append(w);
                      }
                      if (keep.length() > 0) {
                          String v = normKw(a.group(1)) + " " + keep;
                          if (!out.contains(v)) out.add(v);
                      }
                  }
                  Matcher b = STREET_B.matcher(text);
                  while (b.find()) {
                      String rest = text.substring(b.end());
                      boolean claimed = rest.length() > 1 && Character.isWhitespace(rest.charAt(0)) && Character.isUpperCase(rest.trim().isEmpty() ? 'a' : rest.trim().codePointAt(0));
                      if (isCap(b.group(1)) && !claimed) {
                          String v = normKw(b.group(2)) + " " + b.group(1);
                          if (!out.contains(v)) out.add(v);
                      }
                  }
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < out.size() && i < 2; i++) {
                      if (i > 0) sb.append(" і ");
                      sb.append(out.get(i));
                  }
                  return sb.toString();
              }

              public static Res classify(String text) {
                  if (text == null) return null;
                  if (!okText(text)) return null;
                  String type = null, comm = null, action = "Виявлено";
                  if (RALL.matcher(text).find()) {
                      type = "Відбій тривоги";
                      action = "Відбій";
                  } else {
                      for (int i = 0; i < TYPE_RE.length; i++) if (TYPE_RE[i].matcher(text).find()) { type = TYPE_NAMES[i]; break; }
                      if (type == null) return null;
                  }
                  for (int i = 0; i < COMM_RE.length; i++) if (COMM_RE[i].matcher(text).find()) { comm = COMM_NAMES[i]; break; }
                  if (comm == null) return null;
                  if (!"Відбій тривоги".equals(type)) {
                      boolean f = RFALL.matcher(text).find();
                      boolean d = RDET.matcher(text).find();
                      if (RKILL.matcher(text).find()) action = "Збито";
                      else if (f && RAKV.matcher(text).find()) action = "Впав в акваторії";
                      else if (f && d) action = "Падіння і детонація";
                      else if (d) action = "Детонація";
                      else if (f) action = "Падіння";
                  }
                  Res res = new Res();
                  res.type = type; res.comm = comm; res.action = action;
                  res.street = "Відбій тривоги".equals(type) ? "" : streets(text);
                  return res;
              }

              public static List<Msg> parse(String html) {
                  List<Msg> out = new ArrayList<Msg>();
                  if (html == null) return out;
                  Matcher m = POST.matcher(html);
                  List<String> ids = new ArrayList<String>();
                  List<int[]> pos = new ArrayList<int[]>();
                  while (m.find()) { ids.add(m.group(1)); pos.add(new int[]{m.start(), m.end()}); }
                  for (int i = 0; i < ids.size(); i++) {
                      int from = pos.get(i)[1];
                      int to = (i + 1 < ids.size()) ? pos.get(i + 1)[0] : html.length();
                      String seg = html.substring(from, to);
                      Matcher t = TEXT.matcher(seg);
                      if (!t.find()) continue;
                      String text = clean(t.group(1));
                      if (text.length() == 0) continue;
                      Matcher tm = TIME.matcher(seg);
                      if (!tm.find()) continue;
                      long ms = parseTime(tm.group(1));
                      if (ms <= 0) continue;
                      Msg g = new Msg();
                      g.id = ids.get(i); g.text = text; g.ms = ms;
                      out.add(g);
                  }
                  return out;
              }

              static long parseTime(String s) {
                  try {
                      String t = s.replaceAll("([+-])(\\d\\d):(\\d\\d)$", "$1$2$3");
                      SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ssZ", Locale.US);
                      return f.parse(t).getTime();
                  } catch (Exception e) {
                      return -1L;
                  }
              }

              static String clean(String h) {
                  String s = h.replaceAll("(?i)<br\\s*/?>", " ");
                  s = s.replaceAll("<[^>]+>", "");
                  s = unescape(s);
                  return s.replaceAll("\\s+", " ").trim();
              }

              static String unescape(String s) {
                  Matcher m = Pattern.compile("&#(\\d+);|&#[xX]([0-9a-fA-F]+);").matcher(s);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      String rep = " ";
                      try {
                          int cp = (m.group(1) != null) ? Integer.parseInt(m.group(1)) : Integer.parseInt(m.group(2), 16);
                          rep = new String(Character.toChars(cp));
                      } catch (Exception e) { }
                      m.appendReplacement(sb, Matcher.quoteReplacement(rep));
                  }
                  m.appendTail(sb);
                  return sb.toString().replace("&nbsp;", " ").replace("&lt;", "<").replace("&gt;", ">").replace("&quot;", "\"").replace("&amp;", "&");
              }
          }
          ZPEOF
          cat > $D/AlertService.java <<'ZPEOF'
          package ua.zaporizhzhia.alerts;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.Iterator;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.Map;
          import java.util.concurrent.Callable;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.TimeUnit;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class AlertService extends Service implements TextToSpeech.OnInitListener {
              static final String CH_BG = "zp_bg";
              static final String CH_ALERT = "zp_alert";
              static final String PREFS = "zp";

              static class Cfg {
                  boolean enabled = false;
                  boolean sound = true;
                  boolean sch = false;
                  String t1 = "04:00";
                  String t2 = "22:00";
                  float pitch = 0.5f;
                  float rate = 0.85f;
                  List<String> src = new ArrayList<String>();
                  List<String> comm = new ArrayList<String>();

                  static Cfg load(Context c) {
                      Cfg cfg = new Cfg();
                      try {
                          String js = c.getSharedPreferences(PREFS, 0).getString("cfg", null);
                          if (js == null) return cfg;
                          JSONObject o = new JSONObject(js);
                          cfg.enabled = o.optBoolean("enabled", false);
                          cfg.sound = o.optBoolean("sound", true);
                          cfg.sch = o.optBoolean("sch", false);
                          cfg.t1 = o.optString("t1", "04:00");
                          cfg.t2 = o.optString("t2", "22:00");
                          cfg.pitch = (float) o.optDouble("pitch", 0.5);
                          cfg.rate = (float) o.optDouble("rate", 0.85);
                          JSONArray a = o.optJSONArray("src");
                          if (a != null) for (int i = 0; i < a.length(); i++) cfg.src.add(a.optString(i));
                          JSONArray b = o.optJSONArray("comm");
                          if (b != null) for (int i = 0; i < b.length(); i++) cfg.comm.add(b.optString(i));
                      } catch (Exception e) { }
                      return cfg;
                  }
              }

              private volatile boolean running = false;
              private Thread worker;
              private TextToSpeech tts;
              private volatile boolean ttsReady = false;
              private final List<String> pending = Collections.synchronizedList(new ArrayList<String>());
              private PowerManager.WakeLock wl;
              private volatile long lastSpeak = 0;
              private final Set<String> announced = Collections.synchronizedSet(new LinkedHashSet<String>());

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();
                  loadAnnounced();
                  tts = new TextToSpeech(getApplicationContext(), this);
              }

              @Override
              public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS) {
                      setSt("tts", "голосовий рушій не запустився (код " + status + ")");
                      return;
                  }
                  String lang = "мову не знайдено";
                  try {
                      Locale[] cands = { new Locale("uk", "UA"), new Locale("ru", "RU") };
                      boolean ok = false;
                      for (Locale l : cands) {
                          int r = tts.setLanguage(l);
                          if (r >= 0) { lang = l.getLanguage(); ok = true; break; }
                      }
                      if (!ok) lang = "немає української й російської, встановіть голос у налаштуваннях Android";
                      AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build();
                      tts.setAudioAttributes(aa);
                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                          @Override public void onStart(String id) { setSt("tts", "говорить"); }
                          @Override public void onDone(String id) { setSt("tts", "озвучено"); }
                          @Override public void onError(String id) { setSt("tts", "помилка озвучки"); }
                      });
                  } catch (Exception e) { }
                  setSt("tts", "готовий, мова: " + lang);
                  ttsReady = true;
                  synchronized (pending) {
                      for (String t : pending) speakNow(t);
                      pending.clear();
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification n = bgNotification();
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      } else {
                          startForeground(1, n);
                      }
                  } catch (Exception e) { }
                  if (intent != null && "speak".equals(intent.getAction())) {
                      String t = intent.getStringExtra("text");
                      if (t != null && t.length() > 0) say(t);
                  }
                  if (!running) {
                      running = true;
                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "zp:alerts");
                          wl.acquire();
                      } catch (Exception e) { }
                      worker = new Thread(new Runnable() {
                          @Override public void run() { loop(); }
                      });
                      worker.start();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  running = false;
                  try { if (worker != null) worker.interrupt(); } catch (Exception e) { }
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { }
                  try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Exception e) { }
                  super.onDestroy();
              }

              private void loop() {
                  while (running) {
                      Cfg c = Cfg.load(this);
                      if (c.enabled) {
                          ExecutorService ex = Executors.newFixedThreadPool(5);
                          List<Future<String>> fs = new ArrayList<Future<String>>();
                          final Cfg cc = c;
                          for (final String ch : c.src) {
                              fs.add(ex.submit(new Callable<String>() {
                                  @Override public String call() {
                                      try { poll(cc, ch); return null; } catch (Exception e) { return ch + ": " + e.getMessage(); }
                                  }
                              }));
                          }
                          int okN = 0;
                          String lastErr = "";
                          for (Future<String> f : fs) {
                              try {
                                  String r = f.get(60, TimeUnit.SECONDS);
                                  if (r == null) okN++; else lastErr = r;
                              } catch (Exception e) { }
                          }
                          ex.shutdownNow();
                          setSt("svc", new SimpleDateFormat("HH:mm:ss").format(new Date()) + " перевірено " + okN + " з " + c.src.size() + (lastErr.length() > 0 ? "; остання помилка " + lastErr : ""));
                      } else if (System.currentTimeMillis() - lastSpeak > 20000) {
                          stopSelf();
                          return;
                      }
                      try { Thread.sleep(c.enabled ? 30000 : 5000); } catch (InterruptedException e) { break; }
                  }
              }

              private void poll(Cfg c, String ch) throws Exception {
                  String html = fetch("https://t.me/s/" + ch);
                  List<Parser.Msg> msgs = Parser.parse(html);
                  long now = System.currentTimeMillis();
                  for (Parser.Msg m : msgs) {
                      Parser.Res r = Parser.classify(m.text);
                      if (r == null) continue;
                      if (announced.contains(m.id)) continue;
                      if (now - m.ms > 15 * 60000L) continue;
                      announced.add(m.id);
                      saveAnnounced();
                      if (!c.comm.contains(r.comm)) continue;
                      announce(c, r);
                  }
              }

              private final Map<String, Long> recent = new ConcurrentHashMap<String, Long>();

              private boolean recentSkip(Parser.Res r) {
                  long now = System.currentTimeMillis();
                  long win = "Відбій тривоги".equals(r.type) ? 300000L : 600000L;
                  String base = r.type + "|" + r.comm + "|";
                  String street = r.street == null ? "" : r.street;
                  String k = base + street;
                  if (street.length() > 0) {
                      Long l = recent.get(k);
                      if (l != null && now - l < win) return true;
                  } else {
                      for (Map.Entry<String, Long> e : recent.entrySet()) {
                          if (e.getKey().startsWith(base) && now - e.getValue() < win) return true;
                      }
                  }
                  recent.put(k, now);
                  return false;
              }

              private void announce(Cfg c, Parser.Res r) {
                  if (recentSkip(r)) return;
                  boolean allClear = "Відбій тривоги".equals(r.type);
                  String where = r.comm + ((!allClear && r.street != null && r.street.length() > 0) ? ", " + r.street : "");
                  if (c.sound && inSchedule(c)) {
                      if (allClear) say("Відбій тривоги. " + where + ".");
                      else say("Увага! " + r.type + ". " + where + ". " + r.action + ".");
                  }
                  notifyAlert(r.type, allClear ? where : (where + " — " + r.action));
              }

              private boolean inSchedule(Cfg c) {
                  if (!c.sch) return true;
                  Calendar cal = Calendar.getInstance();
                  int n = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                  int a = mins(c.t1), b = mins(c.t2);
                  return a <= b ? (n >= a && n <= b) : (n >= a || n <= b);
              }

              private int mins(String v) {
                  try {
                      String[] p = v.split(":");
                      return Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]);
                  } catch (Exception e) { return 0; }
              }

              private String fetch(String u) throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(u).openConnection();
                  con.setConnectTimeout(8000);
                  con.setReadTimeout(15000);
                  con.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36");
                  try {
                      if (con.getResponseCode() != 200) throw new Exception("HTTP " + con.getResponseCode());
                      BufferedReader br = new BufferedReader(new InputStreamReader(con.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) {
                          sb.append(line).append('\n');
                          if (sb.length() > 3000000) break;
                      }
                      br.close();
                      return sb.toString();
                  } finally {
                      con.disconnect();
                  }
              }

              private void say(String text) {
                  lastSpeak = System.currentTimeMillis();
                  if (ttsReady) speakNow(text); else pending.add(text);
              }

              private void speakNow(String text) {
                  try {
                      Cfg c = Cfg.load(this);
                      tts.setPitch(c.pitch);
                      tts.setSpeechRate(c.rate);
                      int res = tts.speak(text, TextToSpeech.QUEUE_ADD, null, "zp" + System.nanoTime());
                      if (res != TextToSpeech.SUCCESS) setSt("tts", "speak повернув помилку " + res);
                  } catch (Exception e) { }
              }

              private void setSt(String k, String v) {
                  try { getSharedPreferences(PREFS, 0).edit().putString(k, v).apply(); } catch (Exception e) { }
              }

              private void loadAnnounced() {
                  try {
                      String js = getSharedPreferences(PREFS, 0).getString("ann", "[]");
                      JSONArray a = new JSONArray(js);
                      for (int i = 0; i < a.length(); i++) announced.add(a.optString(i));
                  } catch (Exception e) { }
              }

              private void saveAnnounced() {
                  try {
                      synchronized (announced) {
                          while (announced.size() > 400) {
                              Iterator<String> it = announced.iterator();
                              it.next();
                              it.remove();
                          }
                          JSONArray a = new JSONArray();
                          for (String s : announced) a.put(s);
                          SharedPreferences.Editor ed = getSharedPreferences(PREFS, 0).edit();
                          ed.putString("ann", a.toString());
                          ed.apply();
                      }
                  } catch (Exception e) { }
              }

              private void createChannels() {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  NotificationChannel bg = new NotificationChannel(CH_BG, "Фонова робота", NotificationManager.IMPORTANCE_LOW);
                  nm.createNotificationChannel(bg);
                  NotificationChannel al = new NotificationChannel(CH_ALERT, "Загрози", NotificationManager.IMPORTANCE_HIGH);
                  al.enableVibration(true);
                  al.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(al);
              }

              private PendingIntent openIntent() {
                  try {
                      Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      if (open == null) return null;
                      return PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  } catch (Exception e) { return null; }
              }

              private Notification bgNotification() {
                  return new NotificationCompat.Builder(this, CH_BG)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("Загрози Запоріжжя")
                      .setContentText("Стежимо за загрозами")
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setContentIntent(openIntent())
                      .build();
              }

              private void notifyAlert(String title, String body) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      Notification n = new NotificationCompat.Builder(this, CH_ALERT)
                          .setSmallIcon(android.R.drawable.ic_dialog_alert)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_ALARM)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setAutoCancel(true)
                          .setContentIntent(openIntent())
                          .build();
                      nm.notify((int) (System.currentTimeMillis() % 2000000000L), n);
                  } catch (Exception e) { }
              }
          }
