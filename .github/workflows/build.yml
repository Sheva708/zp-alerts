          package ua.zaporizhzhia.alerts;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Alerts")
          public class AlertsPlugin extends Plugin {

              private void startSvc(String action, String text) {
                  Context ctx = getContext();
                  Intent i = new Intent(ctx, AlertService.class);
                  if (action != null) {
                      i.setAction(action);
                      i.putExtra("text", text);
                  }
                  ContextCompat.startForegroundService(ctx, i);
              }

              @PluginMethod
              public void configure(PluginCall call) {
                  try {
                      String js = call.getData().toString();
                      getContext().getSharedPreferences("zp", 0).edit().putString("cfg", js).apply();
                      boolean en = call.getBoolean("enabled", false);
                      if (en) {
                          startSvc(null, null);
                      } else {
                          getContext().stopService(new Intent(getContext(), AlertService.class));
                      }
                  } catch (Exception e) { }
                  call.resolve();
              }

              @PluginMethod
              public void speak(PluginCall call) {
                  try {
                      String t = call.getString("text", "");
                      startSvc("speak", t);
                  } catch (Exception e) { }
                  call.resolve();
              }

              @PluginMethod
              public void askPermissions(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= 33 && getActivity() != null) {
                          ActivityCompat.requestPermissions(getActivity(), new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  } catch (Exception e) { }
                  call.resolve();
              }

              @PluginMethod
              public void batterySettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Exception e) {
                      try {
                          Intent j = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                          j.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(j);
                      } catch (Exception e2) { }
                  }
                  call.resolve();
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject r = new JSObject();
                  try {
                      SharedPreferences p = getContext().getSharedPreferences("zp", 0);
                      r.put("tts", p.getString("tts", "ще не запускався"));
                      r.put("svc", p.getString("svc", "ще не перевіряла"));
                  } catch (Exception e) { }
                  call.resolve(r);
              }

              @PluginMethod
              public void ttsSettings(PluginCall call) {
                  try {
                      Intent i = new Intent("com.android.settings.TTS_SETTINGS");
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Exception e) {
                      try {
                          Intent j = new Intent(Settings.ACTION_SETTINGS);
                          j.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(j);
                      } catch (Exception e2) { }
                  }
                  call.resolve();
              }
          }
