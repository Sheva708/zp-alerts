name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"ua.zaporizhzhia.alerts","appName":"Zaporizhzhia Alerts","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Allow microphone
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zaporizhzhia-alerts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
